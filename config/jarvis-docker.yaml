letta:
  base_url: "http://letta_server:8283"

agent:
  name: "jarvis"
  model: "openai/gpt-5.2"
  embedding: "openai/text-embedding-3-small"
  context_window_limit: 30000

user:
  name: "Kartik"
  preferred_channel: "whatsapp"

slack:
  enabled: true
  bot_token: ""   # Set via SLACK_BOT_TOKEN env var
  app_token: ""   # Set via SLACK_APP_TOKEN env var

http:
  port: 9100
  host: "0.0.0.0"

whatsapp:
  enabled: true
  bridge_url: "http://whatsapp_bridge:9120"
  allow_groups: false

google:
  client_secrets_path: "/app/secrets/gcp_oauth_client_id.json"
  token_path: "/app/secrets/google_token.json"

notion:
  enabled: false

browser:
  enabled: true
  headless: true
  timeout_ms: 30000

monitoring:
  metrics_enabled: true
  log_format: "json"

letta:
  base_url: "http://localhost:8283"

agent:
  name: "jarvis"
  model: "openai/gpt-5.2"
  embedding: "openai/text-embedding-3-small"
  context_window_limit: 30000

user:
  name: "Kartik"
  preferred_channel: "cli"

slack:
  enabled: false

http:
  port: 9100
  host: "0.0.0.0"

whatsapp:
  enabled: false

google:
  client_secrets_path: "gcp_oauth_client_id.json"
  token_path: "google_token.json"

todoist:
  enabled: false

notion:
  enabled: false

browser:
  enabled: false

memory:
  learning_enabled: false

voice:
  enabled: true
  stt_model: "whisper-1"
  tts_model: "tts-1"
  tts_voice: "nova"
  tts_mode: "always"

monitoring:
  metrics_enabled: true
  log_format: "console"

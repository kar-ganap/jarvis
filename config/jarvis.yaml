letta:
  base_url: "http://localhost:8283"

agent:
  name: "jarvis"
  model: "openai/gpt-5.2"
  embedding: "openai/text-embedding-3-small"
  context_window_limit: 30000

user:
  name: "Kartik"
  preferred_channel: "cli"

slack:
  enabled: true
  bot_token: ""   # Set via SLACK_BOT_TOKEN env var
  app_token: ""   # Set via SLACK_APP_TOKEN env var

http:
  port: 9100
  host: "0.0.0.0"
  auth_token: ""  # Set via JARVIS_HTTP_AUTH_TOKEN env var

whatsapp:
  enabled: true
  bridge_url: "http://localhost:9120"
  allow_groups: false
  allowed_senders: []  # Empty = allow all. Set JIDs to restrict.

google:
  client_secrets_path: "gcp_oauth_client_id.json"
  token_path: "google_token.json"

todoist:
  enabled: false

notion:
  enabled: false

browser:
  enabled: true
  headless: true
  timeout_ms: 30000

memory:
  learning_enabled: true
  learning_interval_hours: 24

voice:
  enabled: false
  stt_model: "whisper-1"
  tts_model: "tts-1"
  tts_voice: "nova"
  tts_mode: "auto"

monitoring:
  metrics_enabled: true
  log_format: "console"

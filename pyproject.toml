[project]
name = "jarvis"
version = "0.1.0"
description = "Personal AI assistant built on Letta with Anthropic Claude"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "letta-client>=1.7.8",
    "pydantic-settings>=2.12.0",
    "pyyaml>=6.0.3",
    "structlog>=25.5.0",
]

[project.scripts]
jarvis = "jarvis.__main__:main"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.15.0",
]

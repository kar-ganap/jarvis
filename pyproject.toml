[project]
name = "jarvis"
version = "0.1.0"
description = "Personal AI assistant built on Letta with Anthropic Claude"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
jarvis = "jarvis.__main__:main"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

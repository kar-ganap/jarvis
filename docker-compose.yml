services:
  letta_db:
    image: ankane/pgvector:v0.5.1
    environment:
      POSTGRES_USER: letta
      POSTGRES_PASSWORD: letta
      POSTGRES_DB: letta
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U letta"]
      interval: 5s
      timeout: 5s
      retries: 5

  letta_server:
    image: letta/letta:latest
    depends_on:
      letta_db:
        condition: service_healthy
    ports:
      - "8283:8283"
    env_file:
      - .env
    environment:
      - LETTA_PG_URI=postgresql://letta:letta@letta_db:5432/letta

  whatsapp_bridge:
    build:
      context: ./bridge/whatsapp
      dockerfile: Dockerfile
    ports:
      - "9120:9120"
    environment:
      - WHATSAPP_WEBHOOK_URL=http://host.docker.internal:9100/whatsapp/inbound
      - WHATSAPP_BRIDGE_PORT=9120
      - WHATSAPP_AUTH_DIR=/data/auth
    volumes:
      - whatsapp_auth:/data/auth
    restart: unless-stopped

volumes:
  pgdata:
  whatsapp_auth:
